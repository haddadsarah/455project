{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}<div class="panel form-narrow"><h1>Change password</h1>
<form method="post" novalidate>{% csrf_token %}
  {% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% if field.errors %}<ul class="errorlist" role="alert">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}{% endfor %}
  <div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" type="submit">Change password</button><a class="btn" href="{% url 'dashboard' %}">Cancel</a></div></form></div>{% endblock %}
