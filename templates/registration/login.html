{% extends "base.html" %}
{% block title %}Sign in · CipherBreak EDU{% endblock %}
{% block content %}
<div class="shell auth-layout">
  <section class="auth-art" aria-label="CipherBreak Research Facility"><p class="overline">CIPHERBREAK RESEARCH FACILITY</p><h1>Return to the <em>lab.</em></h1></section>
  <section class="card auth-card">
    <h2>Sign in</h2>
    <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button button-green" type="submit">Sign in</button></form>
    <p>New student? <a href="{% url 'register' %}">Create an account</a></p>
  </section>
</div>
{% endblock %}
