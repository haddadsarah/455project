<div class="table-scroll"><table><thead><tr><th scope="col">Learning objective</th><th scope="col">Solved</th><th scope="col">Mistakes</th><th scope="col">Hints</th><th scope="col">Accuracy</th></tr></thead><tbody>
{% for code, text, row in topics %}<tr><th scope="row"><span class="mono green">{{ code }}</span> · {{ text }}</th><td>{{ row.correct }}</td><td>{{ row.mistakes }}</td><td>{{ row.hints }}</td><td>{% if row.accuracy is not None %}{{ row.accuracy }}%{% else %}—{% endif %}</td></tr>{% endfor %}
</tbody></table></div>
